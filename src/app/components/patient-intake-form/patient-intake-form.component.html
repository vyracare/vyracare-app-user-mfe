<form class="patient-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <fieldset [disabled]="loading" class="form-fieldset">
    <div class="form-card">
      <div class="form-header">
        <vc-heading [level]="2">Ficha inicial do paciente</vc-heading>
        <vc-text [muted]="true">Registre informacoes pessoais, historico clinico e objetivos esteticos.</vc-text>
      </div>

      <div class="form-section">
        <vc-heading [level]="3">Dados pessoais</vc-heading>
        <div class="form-grid">
          <vc-input
            id="patient-full-name"
            label="Nome completo"
            placeholder="Ex: Maria Silva"
            formControlName="fullName"
            [error]="form.controls.fullName.touched && form.controls.fullName.invalid ? 'Informe o nome completo.' : ''"
          ></vc-input>

          <vc-input
            id="patient-birth-date"
            label="Data de nascimento"
            type="date"
            mask="date"
            formControlName="birthDate"
            [error]="
              form.controls.birthDate.touched && form.controls.birthDate.invalid
                ? 'Informe a data de nascimento.'
                : ''
            "
          ></vc-input>

          <vc-select
            id="patient-gender"
            label="Genero"
            placeholder="Selecione"
            formControlName="gender"
            [options]="genderOptions"
            [error]="form.controls.gender.touched && form.controls.gender.invalid ? 'Informe o genero.' : ''"
          ></vc-select>

          <vc-input
            id="patient-cpf"
            label="CPF"
            mask="cpf"
            placeholder="000.000.000-00"
            formControlName="cpf"
            [error]="form.controls.cpf.touched && form.controls.cpf.invalid ? 'Informe o CPF.' : ''"
          ></vc-input>

          <vc-input
            id="patient-email"
            label="Email"
            type="email"
            mask="email"
            placeholder="email@exemplo.com"
            formControlName="email"
            [error]="form.controls.email.touched && form.controls.email.invalid ? 'Informe um email valido.' : ''"
          ></vc-input>

          <vc-input
            id="patient-phone"
            label="Telefone"
            type="tel"
            mask="phone"
            placeholder="(11) 99999-9999"
            formControlName="phone"
            [error]="form.controls.phone.touched && form.controls.phone.invalid ? 'Informe o telefone principal.' : ''"
          ></vc-input>

        </div>
      </div>

      <div class="form-section">
        <vc-heading [level]="3">Endereco</vc-heading>
        <div class="form-grid">
          <div class="full postal-code-row">
            <vc-input
              id="patient-address-zip"
              label="CEP"
              mask="postalCode"
              placeholder="00000-000"
              formControlName="addressZip"
              [hint]="postalCodeLoading() ? 'Consultando os Correios...' : postalCodeFeedback()"
              [error]="postalCodeError() || (form.controls.addressZip.touched && form.controls.addressZip.invalid ? 'Informe um CEP valido.' : '')"
              (blurred)="lookupPostalCode($event)"
            ></vc-input>
          </div>
          <div class="full">
            <vc-input
              id="patient-address-street"
              label="Rua"
              placeholder="Ex: Rua das Flores"
              formControlName="addressStreet"
              [error]="form.controls.addressStreet.touched && form.controls.addressStreet.invalid ? 'Informe a rua.' : ''"
            ></vc-input>
          </div>

          <vc-input
            id="patient-address-number"
            label="Numero"
            placeholder="123"
            formControlName="addressNumber"
            [error]="form.controls.addressNumber.touched && form.controls.addressNumber.invalid ? 'Informe o numero.' : ''"
          ></vc-input>

          <vc-input
            id="patient-address-complement"
            label="Complemento"
            placeholder="Apto, sala, bloco"
            formControlName="addressComplement"
          ></vc-input>

          <vc-input
            id="patient-address-neighborhood"
            label="Bairro"
            placeholder="Centro"
            formControlName="addressNeighborhood"
            [error]="
              form.controls.addressNeighborhood.touched && form.controls.addressNeighborhood.invalid
                ? 'Informe o bairro.'
                : ''
            "
          ></vc-input>

          <vc-input
            id="patient-address-city"
            label="Cidade"
            placeholder="Sao Paulo"
            formControlName="addressCity"
            [error]="form.controls.addressCity.touched && form.controls.addressCity.invalid ? 'Informe a cidade.' : ''"
          ></vc-input>

          <vc-select
            id="patient-address-state"
            label="Estado"
            placeholder="Selecione"
            formControlName="addressState"
            [options]="stateOptions"
            [error]="form.controls.addressState.touched && form.controls.addressState.invalid ? 'Informe o estado.' : ''"
          ></vc-select>

        </div>
      </div>

      <div class="form-section">
        <vc-heading [level]="3">Contato de emergencia</vc-heading>
        <div class="form-grid">
          <vc-input
            id="patient-emergency-contact-name"
            label="Nome do contato"
            placeholder="Ex: Ana Silva"
            formControlName="emergencyContactName"
            [error]="
              form.controls.emergencyContactName.touched && form.controls.emergencyContactName.invalid
                ? 'Informe o contato de emergencia.'
                : ''
            "
          ></vc-input>

          <vc-input
            id="patient-emergency-contact-phone"
            label="Telefone do contato"
            type="tel"
            mask="phone"
            placeholder="(11) 97777-6666"
            formControlName="emergencyContactPhone"
            [error]="
              form.controls.emergencyContactPhone.touched && form.controls.emergencyContactPhone.invalid
                ? 'Informe o telefone de emergencia.'
                : ''
            "
          ></vc-input>
        </div>
      </div>

      <div class="form-section">
        <vc-heading [level]="3">Anamnese e objetivos</vc-heading>
        <div class="form-grid">
          <label class="form-field full">
            <span>Queixa principal</span>
            <textarea
              rows="3"
              placeholder="Descreva a principal queixa estetica."
              formControlName="mainComplaint"
              [class.invalid]="form.controls.mainComplaint.touched && form.controls.mainComplaint.invalid"
            ></textarea>
            <small class="error" *ngIf="form.controls.mainComplaint.touched && form.controls.mainComplaint.invalid">
              Informe a queixa principal.
            </small>
          </label>

          <label class="form-field full">
            <span>Objetivos do tratamento</span>
            <textarea
              rows="3"
              placeholder="Resultados que o paciente espera."
              formControlName="objectives"
              [class.invalid]="form.controls.objectives.touched && form.controls.objectives.invalid"
            ></textarea>
            <small class="error" *ngIf="form.controls.objectives.touched && form.controls.objectives.invalid">
              Informe os objetivos.
            </small>
          </label>

          <label class="form-field full"><span>Condicoes medicas</span><textarea rows="3" placeholder="Ex: hipertensao" formControlName="medicalConditions"></textarea></label>
          <label class="form-field full"><span>Alergias</span><textarea rows="3" placeholder="Ex: cosmeticos, medicamentos" formControlName="allergies"></textarea></label>
          <label class="form-field full"><span>Medicacoes em uso</span><textarea rows="3" placeholder="Ex: suplementos, remedios continuos" formControlName="medications"></textarea></label>
          <label class="form-field full"><span>Cirurgias anteriores</span><textarea rows="3" placeholder="Ex: cirurgia plastica" formControlName="previousSurgeries"></textarea></label>
          <label class="form-field full"><span>Procedimentos esteticos anteriores</span><textarea rows="3" placeholder="Ex: botox, peeling" formControlName="aestheticProcedures"></textarea></label>

          <vc-select
            id="patient-skin-type"
            label="Tipo de pele"
            placeholder="Selecione"
            formControlName="skinType"
            [options]="skinTypeOptions"
          ></vc-select>

          <vc-select
            id="patient-sun-exposure"
            label="Exposicao solar"
            placeholder="Selecione"
            formControlName="sunExposure"
            [options]="sunExposureOptions"
          ></vc-select>
        </div>
      </div>

      <div class="form-section">
        <vc-heading [level]="3">Habitos e condicoes</vc-heading>
        <div class="toggle-grid">
          <vc-checkbox label="Tabagismo" description="Paciente fuma regularmente?" formControlName="smoking"></vc-checkbox>
          <vc-checkbox label="Consumo de alcool" description="Paciente consome alcool com frequencia?" formControlName="alcohol"></vc-checkbox>
          <vc-checkbox label="Gestacao ou lactacao" description="Paciente esta gestante ou amamentando?" formControlName="pregnantOrBreastfeeding"></vc-checkbox>
        </div>
      </div>

      <div class="form-section">
        <vc-heading [level]="3">Observacoes adicionais</vc-heading>
        <div class="form-grid">
          <label class="form-field full">
            <span>Notas do profissional</span>
            <textarea rows="3" placeholder="Preferencias, observacoes e cuidados" formControlName="notes"></textarea>
          </label>
        </div>
      </div>

      <vc-checkbox
        id="patient-consent"
        label="Consentimento do paciente"
        description="Confirmo que as informacoes acima sao verdadeiras e autorizo o uso para fins clinicos."
        formControlName="consent"
        [error]="form.controls.consent.touched && form.controls.consent.invalid ? 'Confirme o consentimento do paciente.' : ''"
      ></vc-checkbox>

      <div class="form-actions">
        @if (!readOnly) {
          <vc-button type="button" variant="ghost" (click)="resetForm()">Restaurar</vc-button>
          <vc-button type="submit" [loading]="loading" [disabled]="loading">
            {{ loading ? 'Salvando...' : submitLabel }}
          </vc-button>
        }
      </div>

      <p class="error-banner" *ngIf="error">{{ error }}</p>
    </div>
  </fieldset>
</form>
